unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# mouse mode: click to focus panes/windows, drag to resize, scroll to enter copy mode.
# Hold Option/Fn while dragging to bypass tmux selection and use the terminal's
# native click-and-drag (e.g. Ghostty Cmd+Click on URLs works more reliably).
set -g mouse on

# split panes using | and - (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

# new window opens in the session's home directory (usually the project root),
# so `cd`-ing away in one pane doesn't contaminate future windows.
# Capital C opens in the current pane's path when you actually want that.
bind c new-window -c "#{session_path}"
bind C new-window -c "#{pane_current_path}"

# kill pane/window without confirmation
bind-key x kill-pane
bind-key X kill-window

# detach all OTHER clients (keep current). Use when stale clients from closed
# Ghostty windows are hiding sessions from `tms switch`.
bind-key D run-shell "tmux list-clients -F '##{client_tty}' | grep -v \"$(tmux display-message -p '#{client_tty}')\" | xargs -I {} tmux detach-client -t {} 2>/dev/null; tmux display-message 'Stale clients detached'"

# project switcher: prefix + f → fuzzy-find a project dir and jump to its session
bind-key f display-popup -E -w 80% -h 70% "tms"
# session switcher: prefix + s → fuzzy-find among RUNNING tmux sessions
# (replaces the default tree-view switcher with vertical navigation)
bind-key s display-popup -E -w 80% -h 70% "tms switch"
# switch back to last session
bind-key Space switch-client -l

# create a new named session rooted at the current pane's directory.
# Use for cross-cutting work that doesn't map to a single project repo
# (e.g. a session at ~/Instinct that spans multiple repos).
bind-key N command-prompt -p "session name:" "new-session -s '%%' -c '#{pane_current_path}'"

# scratch terminal: jump to `main` session, open a fresh window, focus it.
# Use for one-off shells / quick commands that don't belong to a project session.
bind-key t run-shell "tmux switch-client -t main && tmux new-window -t main:"

## pane navigation (vim-style, via prefix — kept as fallback)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

## vim-tmux-navigator: Ctrl+hjkl moves between tmux panes AND nvim windows.
## When the target pane is running vim/nvim, the keystroke is forwarded to nvim;
## nvim's vim-tmux-navigator plugin decides whether to move within nvim or
## hand control back to tmux at the edge.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

## same bindings in copy-mode (so Ctrl+hjkl still navigates out of a copy-mode pane)
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

## pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

## window switching (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

## session switching
bind -r ( switch-client -p
bind -r ) switch-client -n

# start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# scrollback and performance
set -g history-limit 50000
set -sg escape-time 0

# mouse support
set -g mouse on

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'janoamaral/tokyo-night-tmux'

set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_music 0           # now playing (needs media-control)
set -g @tokyo-night-tmux_window_id_style none
# Must be the last item
run '~/.tmux/plugins/tpm/tpm'
